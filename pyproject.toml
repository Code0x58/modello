[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "modello"
description = "sympy expressions in models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "modello/_gui/static/fonts/OFL.txt"]
authors = [{name = "Oliver Bristow", email = "github+pypi@oliverbristow.co.uk"}]
dependencies = ["sympy>=1.14.0"]
keywords = ["symbolic modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Code0x58/modello/"
Documentation = "https://modello.readthedocs.io/"
Issues = "https://github.com/Code0x58/modello/issues"

[project.optional-dependencies]
examples = []
gui = ["flask>=3.1.3"]
pandas = ["pandas>=2.2.3"]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[dependency-groups]
dev = [
    "modello[examples,gui,pandas,test]",
    "build>=1.6.1",
    "mypy>=2.4.0",
    "packaging>=26.3",
    "ruff>=0.17.1",
    "setuptools>=84.0.0",
    "setuptools-scm>=10.3.4",
    "twine>=7.0.0",
]
docs = [
    "modello[examples,pandas]",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
modello = { workspace = true }

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }
notebooks = { requires-python = ">=3.11" }

[tool.setuptools.packages.find]
include = ["modello", "modello._gui", "modello.contrib", "examples", "examples.*"]
namespaces = false

[tool.setuptools.package-data]
modello = ["py.typed"]
"modello._gui" = ["templates/*.html", "static/*.css", "static/*.js", "static/fonts/*"]
examples = ["py.typed"]
"examples.portfolio" = ["data/*.csv"]
"examples.gallery" = ["templates/*.html", "static/*.css"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob=*.rst --doctest-report=udiff --cov=modello --cov-report=html --cov-report=term"
python_files = ["test_*.py"]
cache_dir = "artefacts/reports/.pytest_cache"

[tool.coverage.run]
data_file = "artefacts/reports/.coverage"
source = ["modello"]
branch = true

[tool.coverage.html]
directory = "artefacts/reports/coverage-html"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
cache_dir = "artefacts/reports/.mypy_cache"
exclude = ["^build/", "^docs/_build/", "^artefacts/", "^dist/"]

[[tool.mypy.overrides]]
module = "modello"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
