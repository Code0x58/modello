name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: "true"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag still identifies this commit
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.14"
      - name: Install locked build dependencies
        run: uv sync --dev
      - name: Build distributions
        run: uv build --no-build-isolation --python .venv/bin/python
      - name: Check distribution metadata
        run: uv run --dev twine check --strict dist/*
      - name: Validate release version and installed distributions
        run: uv run --dev python scripts/check_distributions.py dist --expected-version "$RELEASE_TAG"
      - name: Store validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/modello
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
