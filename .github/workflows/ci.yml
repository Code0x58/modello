name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "true"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify selected Python version
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --dev python -c 'import os, sys; actual = f"{sys.version_info.major}.{sys.version_info.minor}"; assert actual == os.environ["EXPECTED_PYTHON_VERSION"], actual'

      - name: Ruff format check
        run: uv run --dev ruff format --check --diff .

      - name: Ruff lint check
        run: uv run --dev ruff check .

      - name: Mypy type check
        run: uv run --dev mypy .

      - name: Run tests
        run: |
          unset PYTEST_DISABLE_PLUGIN_AUTOLOAD
          uv run --dev pytest --verbosity=2 --cov=modello --cov-report=xml --junit-xml=test-results.xml

      - name: Upload coverage to Codecov
        if: (success() || hashFiles('coverage.xml') != '') && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: (success() || hashFiles('test-results.xml') != '') && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./test-results.xml
          report_type: test_results
          fail_ci_if_error: true

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14"
      - name: Install locked build dependencies
        run: uv sync --dev
      - name: Build distributions
        run: uv build --no-build-isolation --python .venv/bin/python
      - name: Check distribution metadata
        run: uv run --dev twine check --strict dist/*
      - name: Check installed distributions outside the checkout
        run: uv run --dev python scripts/check_distributions.py dist

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation and version tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
      - name: Install documentation dependencies
        run: uv sync --group docs
      - name: Build documentation with warnings as errors
        run: uv run --group docs sphinx-build --fail-on-warning --keep-going --builder=html docs docs/_build/html
